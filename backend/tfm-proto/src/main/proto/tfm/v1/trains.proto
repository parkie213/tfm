syntax = "proto3";

package tfm.v1;

import "tfm/v1/boards.proto";

option java_package = "uk.org.tfm.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "TrainsProto";

// ---- Station platform board (Darwin live platform occupancy) ----

// Request the live platform-occupancy board for one station.
message GetStationPlatformsRequest {
  // Station CRS, e.g. "NOT" for Nottingham.
  string crs = 1;
}

// A REST board service or a Kafka fallback observation associated with a platform.
// REST rows have unknown confirmation/presence; no cross-source identity bridge is available.
message PlatformOccupant {
  // 4-char signalling headcode, e.g. "2O28".
  string headcode = 1;
  reserved 2;
  reserved "train_id";
  // Origin / destination station names (fall back to TIPLOC if the name is unresolved); "" if unknown.
  string origin = 3;
  string destination = 4;
  // True if Darwin has confirmed (not merely predicted) the platform.
  bool platform_confirmed = 5;
  // True if Darwin movement shows the service has arrived but not yet departed — standing at the
  // platform right now (arr.at present, dep.at absent). Distinct from platform_confirmed.
  bool at_platform_now = 6;
  // Source-scoped identity; REST service IDs and Darwin RIDs are never interchangeable.
  string identity = 7;
  // Present only for REST board occupants. Times remain REST authoritative.
  StationBoardRow board_row = 8;
  // Unknown includes REST rows and Kafka entries without arrival/departure actuals.
  PlatformPresence presence = 9;
}

enum PlatformPresence {
  PLATFORM_PRESENCE_UNKNOWN = 0;
  PLATFORM_PRESENCE_PRESENT = 1;
  PLATFORM_PRESENCE_DEPARTED = 2;
}

// One platform and its upcoming board services or fallback Kafka observations.
// An empty list does not prove that the physical platform is clear.
message StationPlatform {
  // Platform label as Darwin reports it, e.g. "1", "3A".
  string platform = 1;
  repeated PlatformOccupant trains = 2;
}

// Persisted platform inventory plus reconciled occupants. REST board rows take precedence on
// each platform (next two); Kafka-only occupants are a fallback, never an identity match.
message GetStationPlatformsResponse {
  string crs = 1;
  string station_name = 2;
  repeated StationPlatform platforms = 3;
  // RFC3339 timestamp of when this board was computed.
  string generated_at = 4;
  // Configuration only: a consumer starting at latest may have incomplete state.
  bool platform_feed_enabled = 5;
  bool board_available = 6;
  // True if the platform inventory/enrichment read succeeded; not a completeness guarantee.
  bool platform_data_available = 7;
}

// ---- Train service detail (calling points from the Darwin timetable) ----

// Identify a train from a board row: the station whose board it is, plus the row's scheduled time
// and destination. (The LDBWS service id on the row cannot be joined to the timetable, but
// "calls at <crs> at <time> heading to <destination>" resolves the journey.)
message GetTrainServiceRequest {
  // CRS of the station whose board the row was clicked on, e.g. "MMO".
  string crs = 1;
  // Scheduled departure (or arrival) time exactly as on the board, "HH:MM".
  string scheduled_time = 2;
  // Destination name as shown on the board (used to disambiguate same-minute departures).
  string destination = 3;
  // True if the row came from an arrivals board (match the arrival time instead of departure).
  bool is_arrival = 4;
}

// One public calling point of a train journey.
message TrainCallingPoint {
  int32 sequence = 1;
  // TIPLOC of the calling point.
  string tpl = 2;
  // Display name (station name; falls back to the TIPLOC when unresolved).
  string name = 3;
  // Station coordinates; 0,0 when the TIPLOC has no known position (skip on the map, keep in lists).
  double lat = 4;
  double lng = 5;
  // Public (else working) times, "HH:MM[:SS]"; arrival empty at the origin, departure at the destination.
  string arrival = 6;
  string departure = 7;
}

message GetTrainServiceResponse {
  // False when no journey in the loaded timetable matches the request — show schedule-unavailable.
  bool found = 1;
  // RTTI id of the matched dated run.
  string rid = 2;
  // 4-char signalling headcode.
  string headcode = 3;
  // Operating company code, e.g. "EM".
  string toc = 4;
  // Display names of the journey's origin and destination.
  string origin = 5;
  string destination = 6;
  repeated TrainCallingPoint stops = 7;
  reserved 8;
  reserved "shape";
}
