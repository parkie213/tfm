name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Maven (JDK 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check formatting, build & test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend · Vite (Node 26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc reads .tsbuildinfo (incremental: true) to skip unchanged type checks.
      # setup-node's npm cache covers ~/.npm but not node_modules/.tmp, so cache it here.
      - name: Cache tsc incremental build info
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.tmp
          key: tsbuildinfo-${{ hashFiles('frontend/src/**/*.ts', 'frontend/src/**/*.tsx', 'frontend/tsconfig*.json') }}
          restore-keys: tsbuildinfo-
      - name: Typecheck & build
        run: npm run build
